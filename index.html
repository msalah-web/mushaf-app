<title>المصحف – El Mushaf</title>

<meta property="og:description" content="حمّل تطبيق المصحف على App Store وGoogle Play.">
<meta name="apple-itunes-app" content="app-id=6818293130">
<script>
(function () {
  var IOS = "https://apps.apple.com/app/id6818293130";
  var ANDROID = "https://play.google.com/store/apps/details?id=com.elmushaf.el_mushaf";
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
    (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  if (isIOS) location.replace(IOS);
  else if (isAndroid) location.replace(ANDROID);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f6efdc;
    --cream-2: #efe4c6;
    --green: #14402f;
    --green-2: #1d5a42;
    --gold: #b8924a;
    --ink: #2b2a24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Tajawal", system-ui, sans-serif;
    background:
      radial-gradient(circle at 50% 0%, #fffaf0 0%, transparent 60%),
      linear-gradient(180deg, var(--cream) 0%, var(--cream-2) 100%);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    text-align: center;
    padding: 44px 28px 36px;
    border-radius: 28px;
    background: rgba(255, 252, 243, 0.85);
    border: 1px solid rgba(184, 146, 74, 0.45);
    box-shadow: 0 24px 60px -24px rgba(20, 64, 47, 0.35), inset 0 0 0 6px rgba(246, 239, 220, 0.9), inset 0 0 0 7px rgba(184, 146, 74, 0.35);
  }
  .emblem {
    width: 92px; height: 92px;
    margin: 0 auto 22px;
    display: grid; place-items: center;
    border-radius: 24px;
    background: linear-gradient(145deg, var(--green-2), var(--green));
    color: var(--cream);
    font-family: "Amiri", serif;
    font-size: 40px; font-weight: 700;
    box-shadow: 0 10px 24px -10px rgba(20, 64, 47, 0.7), inset 0 1px 0 rgba(255,255,255,0.15);
    border: 2px solid var(--gold);
  }
  h1 {
    font-family: "Amiri", serif;
    font-size: 40px;
    color: var(--green);
    line-height: 1.3;
  }
  .latin {
    font-size: 15px;
    letter-spacing: 3px;
    color: var(--gold);
    margin-top: 2px;
    direction: ltr;
  }
  .divider {
    width: 120px; height: 1px; margin: 22px auto;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  p.lead {
    font-size: 17px;
    line-height: 1.8;
    color: #4a473d;
    margin-bottom: 28px;
  }
  .btns { display: flex; flex-direction: column; gap: 14px; }
  a.btn {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 15px 20px;
    border-radius: 16px;
    text-decoration: none;
    font-size: 18px; font-weight: 700;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  a.btn svg { width: 24px; height: 24px; flex: none; }
  a.btn:hover { transform: translateY(-1px); }
  a.primary {
    background: linear-gradient(180deg, var(--green-2), var(--green));
    color: var(--cream);
    box-shadow: 0 10px 22px -12px rgba(20, 64, 47, 0.8), inset 0 1px 0 rgba(255,255,255,0.15);
  }
  a.secondary {
    background: transparent;
    color: var(--green);
    border: 1.5px solid var(--green);
  }
  footer { margin-top: 26px; font-size: 13px; color: #8a8270; }
</style>
</head>
<body>
  <main class="card">
    <div class="emblem" aria-hidden="true">۞</div>
    <h1>المصحف</h1>
    <div class="latin">EL MUSHAF</div>
    <div class="divider"></div>
    <p class="lead">اقرأ القرآن الكريم واستمع إليه أينما كنت.<br>حمّل التطبيق مجانًا من متجر جهازك.</p>

        <span>App Store</span>
      </a>

        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3.6 2.2c-.23.24-.36.6-.36 1.07v17.46c0 .47.13.83.37 1.07l.06.05L13.4 12.1v-.22L3.66 2.15l-.06.05zM16.66 15.37l-3.25-3.26v-.22l3.25-3.26.07.04 3.85 2.19c1.1.62 1.1 1.65 0 2.28l-3.85 2.19-.07.04zM16.73 15.33 13.4 12 3.6 21.8c.36.38.96.43 1.64.05l11.49-6.52M16.73 8.67 5.24 2.15c-.68-.39-1.28-.34-1.64.05L13.4 12l3.33-3.33z"/></svg>
        <span>Google Play</span>
      </a>
    </div>
    <footer>المصحف – El Mushaf</footer>
  </main>
</body>
</html>
